<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0A1122"/>
      <stop offset="100%" stop-color="#0F1B35"/>
    </linearGradient>
    <radialGradient id="amber-glow" cx="85%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#D97706" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-glow" cx="10%" cy="95%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="85%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="badge-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="term-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#0B1426"/>
    </linearGradient>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45"/>
      <circle cx="40" cy="40" r="1" fill="#F59E0B" fill-opacity="0.25"/>
    </pattern>

    <!-- Typing clip masks (animated width = typing effect) -->
    <clipPath id="type-q">
      <rect x="244" y="222" height="26" width="0">
        <animate attributeName="width" dur="14s" repeatCount="indefinite"
                 values="0;0;400;400" keyTimes="0;0.04;0.18;1"/>
      </rect>
    </clipPath>
    <clipPath id="type-sql">
      <rect x="86" y="278" height="26" width="0">
        <animate attributeName="width" dur="14s" repeatCount="indefinite"
                 values="0;0;600;600" keyTimes="0;0.25;0.42;1"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; letter-spacing: 3px; }
    .sub   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 500; letter-spacing: 2px; }
    .mono  { font-family: "SF Mono", "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace; }
    .kw    { fill: #F59E0B; font-weight: 700; }
    .id    { fill: #E2E8F0; }
    .tbl   { fill: #38BDF8; }
    .num   { fill: #FBBF24; }

    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    .blink { animation: blink 1s step-end infinite; }
  </style>

  <!-- Base surface -->
  <rect width="1200" height="500" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="500" rx="16" fill="url(#amber-glow)"/>
  <rect width="1200" height="500" rx="16" fill="url(#cyan-glow)"/>
  <rect width="1200" height="500" rx="16" fill="url(#grid-pattern)"/>
  <rect x="1" y="1" width="1198" height="498" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="60" y1="1" x2="360" y2="1" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="840" y1="1" x2="1140" y2="1" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- ============ Identity ============ -->
  <g transform="translate(60, 36)">
    <rect width="262" height="28" rx="14" fill="#0D1930" stroke="url(#badge-border)" stroke-width="1.2"/>
    <circle cx="14" cy="14" r="4" fill="#10B981" class="pulse"/>
    <text x="26" y="18" fill="#FBBF24" class="mono" font-size="10.5" font-weight="600" letter-spacing="1.2">DATA ENGINEERING × APPLIED AI</text>
  </g>

  <text x="60" y="114" fill="url(#gold-text-grad)" class="title" font-size="38">KRISHNA SIDHVI NEKKANTI</text>
  <text x="62" y="150" fill="#94A3B8" class="sub" font-size="15">
    FORWARD DEPLOYMENT AI ENGINEER <tspan fill="#F59E0B">•</tspan> DATA &amp; LLM SYSTEMS
  </text>

  <!-- Credential chips (right) -->
  <g class="mono" font-size="11" letter-spacing="1">
    <g transform="translate(830, 36)">
      <rect width="310" height="30" rx="7" fill="#0A1326" stroke="#1E293B" stroke-width="1.2"/>
      <rect width="3" height="30" rx="1.5" fill="#F59E0B"/>
      <text x="16" y="19.5" fill="#F1F5F9">4+ YRS <tspan fill="#64748B">· DATA, CLOUD &amp; AI</tspan></text>
    </g>
    <g transform="translate(830, 74)">
      <rect width="310" height="30" rx="7" fill="#0A1326" stroke="#1E293B" stroke-width="1.2"/>
      <rect width="3" height="30" rx="1.5" fill="#38BDF8"/>
      <text x="16" y="19.5" fill="#F1F5F9">AWS <tspan fill="#64748B">· CERTIFIED DATA ENGINEER</tspan></text>
    </g>
    <g transform="translate(830, 112)">
      <rect width="310" height="30" rx="7" fill="#0A1326" stroke="#1E293B" stroke-width="1.2"/>
      <rect width="3" height="30" rx="1.5" fill="#F59E0B"/>
      <text x="16" y="19.5" fill="#F1F5F9">M.P.S. <tspan fill="#64748B">· DATA SCIENCE, UMBC</tspan></text>
    </g>
  </g>

  <!-- ============ Terminal window ============ -->
  <rect x="60" y="176" width="1080" height="276" rx="10" fill="#050810" fill-opacity="0.88" stroke="#1E293B" stroke-width="1.2"/>
  <path d="M 70 176 H 1130 A 10 10 0 0 1 1140 186 V 206 H 60 V 186 A 10 10 0 0 1 70 176 Z" fill="url(#term-bar)"/>
  <line x1="60" y1="206" x2="1140" y2="206" stroke="#1E293B" stroke-width="1"/>
  <circle cx="82" cy="191" r="5" fill="#EF4444" fill-opacity="0.85"/>
  <circle cx="100" cy="191" r="5" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="118" cy="191" r="5" fill="#10B981" fill-opacity="0.85"/>
  <text x="600" y="195" fill="#64748B" class="mono" font-size="11" text-anchor="middle" letter-spacing="1">krishna — ask-in-plain-english.sql</text>

  <!-- Animated session (fades out at end of each 14s loop) -->
  <g class="mono" font-size="14">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
             values="1;1;0;0" keyTimes="0;0.92;0.97;1"/>

    <!-- 1. Natural-language question -->
    <text x="88" y="240" fill="#10B981">krishna@github<tspan fill="#64748B">:</tspan><tspan fill="#38BDF8">~</tspan><tspan fill="#64748B">$</tspan></text>
    <text x="246" y="240" fill="#F8FAFC" clip-path="url(#type-q)">ask <tspan fill="#34D399">"who is krishna, and what does he build?"</tspan></text>

    <!-- 2. Thinking line -->
    <text x="88" y="268" fill="#64748B" opacity="0">-- parsing intent → generating SQL → validating against schema ✓
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2;0.21;1"/>
    </text>

    <!-- 3. Generated SQL (typed) -->
    <text x="88" y="296" clip-path="url(#type-sql)"><tspan class="kw">SELECT</tspan><tspan class="id"> role, focus, stack </tspan><tspan class="kw">FROM</tspan><tspan class="tbl"> krishna.career </tspan><tspan class="kw">ORDER BY</tspan><tspan class="id"> impact </tspan><tspan class="kw">DESC</tspan><tspan class="id">;</tspan></text>

    <!-- 4. Result table -->
    <g font-size="13">
      <g opacity="0">
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.46;0.47;1"/>
        <rect x="80" y="310" width="1040" height="26" rx="4" fill="#F59E0B" fill-opacity="0.10"/>
        <text x="94" y="328" fill="#FBBF24" font-weight="700" letter-spacing="1">ROLE</text>
        <text x="370" y="328" fill="#FBBF24" font-weight="700" letter-spacing="1">FOCUS</text>
        <text x="660" y="328" fill="#FBBF24" font-weight="700" letter-spacing="1">STACK</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.49;0.50;1"/>
        <text x="94" y="356" fill="#F1F5F9">Forward Deployment AI Eng.</text>
        <text x="370" y="356" fill="#CBD5E1">Agentic AI · LLM systems</text>
        <text x="660" y="356" fill="#94A3B8">Python · LangChain · Hugging Face · SQL</text>
        <line x1="80" y1="365" x2="1120" y2="365" stroke="#1E293B"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.52;0.53;1"/>
        <text x="94" y="384" fill="#F1F5F9">Data Engineer</text>
        <text x="370" y="384" fill="#CBD5E1">Cloud ETL · data quality</text>
        <text x="660" y="384" fill="#94A3B8">AWS Glue · Redshift · PySpark · Kafka</text>
        <line x1="80" y1="393" x2="1120" y2="393" stroke="#1E293B"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.55;0.56;1"/>
        <text x="94" y="412" fill="#F1F5F9">Data Analyst</text>
        <text x="370" y="412" fill="#CBD5E1">BI · decision intelligence</text>
        <text x="660" y="412" fill="#94A3B8">Tableau · Power BI · Microsoft Fabric</text>
      </g>
    </g>

    <!-- 5. Status + cursor -->
    <g opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.59;0.60;1"/>
      <text x="88" y="438" fill="#64748B" font-size="12.5">(3 rows) <tspan fill="#10B981">✓ validated</tspan> · <tspan class="num">0.042s</tspan></text>
      <text x="360" y="438" fill="#10B981" font-size="12.5">krishna@github<tspan fill="#64748B">:</tspan><tspan fill="#38BDF8">~</tspan><tspan fill="#64748B">$</tspan></text>
      <rect x="494" y="427" width="8" height="15" fill="#FBBF24" class="blink"/>
    </g>
  </g>

  <!-- Footer strip -->
  <text x="62" y="481" fill="#475569" class="mono" font-size="10.5" letter-spacing="1">LOCATION: HYDERABAD, INDIA // UMBC ALUMNI</text>
  <text x="1138" y="481" fill="#64748B" class="mono" font-size="10.5" letter-spacing="1" text-anchor="end">QUESTION → QUERY → INSIGHT</text>
</svg>
