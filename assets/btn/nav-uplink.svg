<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 228 52" width="100%" role="img" aria-label="Uplink">
<title>Uplink</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#03060D"/><stop offset=".55" stop-color="#070D1A"/><stop offset="1" stop-color="#0D1830"/>
</linearGradient>
<radialGradient id="glowA" cx="88%" cy="0%" r="70%">
  <stop offset="0" stop-color="#F59E0B" stop-opacity=".16"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowB" cx="5%" cy="100%" r="60%">
  <stop offset="0" stop-color="#0284C7" stop-opacity=".16"/><stop offset="1" stop-color="#0284C7" stop-opacity="0"/>
</radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width=".6" stroke-opacity=".5"/>
</pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glowBig" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<style>
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace; }
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
.pulse { animation: pulse 2.6s ease-in-out infinite; }
.blink { animation: blink 1s step-end infinite; }
</style>
<rect x="1" y="1" width="226" height="50" rx="9" fill="#070D1A" stroke="#1E293B" stroke-width="1.5"/>
<rect x="1" y="1" width="226" height="50" rx="9" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="40 520" stroke-linecap="round" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-560" dur="4s" repeatCount="indefinite"/></rect>
<rect x="10" y="10" width="32" height="32" rx="7" fill="#F59E0B" fill-opacity=".12" stroke="#F59E0B" stroke-opacity=".5"/>
<text x="26" y="31" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#F59E0B">09</text>
<text x="56" y="32" class="mono" font-size="14" font-weight="700" letter-spacing="2.5" fill="#F8FAFC">UPLINK</text>
<text x="212" y="32" text-anchor="end" class="mono" font-size="13" fill="#F59E0B"><tspan class="pulse">▸</tspan></text>
